name: Build KernelSU GKI kernel (OnePlus Ace 3 / sm8550)

# Target device : OnePlus Ace 3 (PJE110), OnePlusOS/ColorOS 16.0.1.300 (CN01)
# Kernel base   : OnePlusOSS "oneplus/sm8550_v_15.0.0_ace_3" = Linux 5.15.167, exactly the
#                 version the device reports. (The "b_16.0.0" line is 5.15.180 - not this device.)
# Source policy : ONLY pristine OnePlusOSS trees. The PoXiao777 fork carries reSukiSU / SUSFS
#                 patches in arch/block/drivers/fs/include/kernel/mm/net/security, which change
#                 struct layouts and export CRCs. A kernel built from it cannot load the stock
#                 vendor_dlkm modules -> module load failure -> boot crash (900e).
# Root solution : KernelSU (tiann/KernelSU), in-kernel CONFIG_KSU=y, kprobe hooks.
#                 KSU only adds code, it does not patch kernel headers, so the module ABI
#                 (CRC / vermagic) stays identical to the stock kernel.
#
# Layout (this branch sources ../vendor/oplus/... through symlinks):
#   ws/                        <- OPLUS modules & devicetree repo
#   ws/kernel_platform/common/ <- pristine kernel source
#   ci/                        <- this repo (only for anykernel3/anykernel.sh)
#   out/                       <- build output

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: 'KernelSU tag / branch / commit (empty or "latest" = newest release)'
        required: false
        default: 'latest'
      label:
        description: 'Extra label appended to the artifact name'
        required: false
        default: ''
      kernel_repo:
        description: 'Kernel repo to build'
        required: false
        default: 'OnePlusOSS/android_kernel_oneplus_sm8550'
      kernel_ref:
        description: 'Kernel branch/tag'
        required: false
        default: 'oneplus/sm8550_v_15.0.0_ace_3'
  push:
    branches:
      - 'ksu-gki/ace3-15.0.0'
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAKE_ARGS: >-
        ARCH=arm64 SUBARCH=arm64 HEADER_ARCH=arm64
        CC=clang CXX=clang++
        LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy
        OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip
        LLVM=1 LLVM_IAS=1
      # ld.lld defaults to --threads=all; on a 4-core/16G runner that makes the
      # thin-LTO vmlinux.o step blow past RAM and get killed (exit 143).
      KERNEL_LD: 'ld.lld --threads=2'

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/lib/jvm /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl dwarves flex git kmod \
            libelf-dev libssl-dev lz4 lzop python3 rsync unzip wget xz-utils \
            zip zstd device-tree-compiler
          pahole --version

      - name: Resolve KernelSU ref
        id: ksu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.ksu_ref }}"
          if [ -z "$ref" ] || [ "$ref" = "latest" ]; then
            ref="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   https://api.github.com/repos/tiann/KernelSU/releases/latest \
                   | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1 || true)"
          fi
          [ -n "$ref" ] || ref="v3.3.1"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "KernelSU ref: $ref"

      - name: Checkout this repo (AnyKernel3 script only)
        uses: actions/checkout@v4
        with:
          path: ci
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout OPLUS modules & devicetree (pristine)
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8550
          ref: oneplus/sm8550_v_15.0.0_ace_3
          path: ws
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout kernel source (pristine OnePlusOSS)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.kernel_repo || 'OnePlusOSS/android_kernel_oneplus_sm8550' }}
          ref: ${{ github.event.inputs.kernel_ref || 'oneplus/sm8550_v_15.0.0_ace_3' }}
          path: ws/kernel_platform/common
          fetch-depth: 1
          persist-credentials: false

      - name: Download AOSP clang (r450784e)
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz" \
            -O clang.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/clang"
          tar -xzf clang.tar.gz -C "$GITHUB_WORKSPACE/clang"
          rm -f clang.tar.gz
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE"/clang/bin/clang --version | head -n 2

      - name: Verify pristine source
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile | tr '\n' ' '; echo
          echo "kernel tree commit : $(git rev-parse HEAD)"
          echo "=== SUSFS / reSukiSU leftovers (expected: none) ==="
          if grep -rl 'susfs' --include='*.c' --include='*.h' fs kernel security include 2>/dev/null | head -5; then
            echo "note: susfs references found"
          else
            echo "clean: no susfs references"
          fi

      - name: Integrate KernelSU (${{ steps.ksu.outputs.ref }})
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          ref="${{ steps.ksu.outputs.ref }}"
          if ! git clone --depth=1 --branch "$ref" https://github.com/tiann/KernelSU KernelSU; then
            git clone https://github.com/tiann/KernelSU KernelSU
            git -C KernelSU checkout "$ref"
          fi
          echo "integrated KernelSU commit: $(git -C KernelSU rev-parse HEAD)"

          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i 's|^endmenu$|source "drivers/kernelsu/Kconfig"\nendmenu|' drivers/Kconfig
          grep -q 'kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          cat >> KernelSU/kernel/Kbuild <<'KSUEOF'

          # --- OnePlus sm8550 / 5.15.167: selinux internal + generated headers ---
          ccflags-y += -I$(srctree)/security/selinux/include -I$(objtree)/security/selinux
          KSUEOF

          # add-only config changes: nothing is disabled, so the module ABI stays intact
          frag=arch/arm64/configs/vendor/kalama_GKI.config
          for cfg in CONFIG_KSU=y CONFIG_KPROBES=y CONFIG_KALLSYMS_ALL=y CONFIG_EXT4_FS=y; do
            key=${cfg%%=*}
            if ! grep -qE "^(# )?${key}(=| is not set)" "$frag"; then
              printf '%s\n' "$cfg" >> "$frag"
            fi
          done
          tail -n 8 "$frag"

      - name: Configure kernel
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          make $MAKE_ARGS O="$GITHUB_WORKSPACE/out" gki_defconfig vendor/kalama_GKI.config
          echo "=== config sanity ==="
          grep -E '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KALLSYMS_ALL|CONFIG_EXT4_FS|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_LTO_CLANG_THIN|CONFIG_CFI_CLANG)=' \
            "$GITHUB_WORKSPACE/out/.config"

      - name: Build kernel
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          free -g
          df -h "$GITHUB_WORKSPACE"
          make $MAKE_ARGS LD="$KERNEL_LD" O="$GITHUB_WORKSPACE/out" -j4 Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "=== images ==="
          ls -l "$GITHUB_WORKSPACE/out/arch/arm64/boot/"

      - name: Package AnyKernel3
        id: pkg
        run: |
          set -euo pipefail
          IMG="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"
          ls -l "$IMG"
          git clone --depth=1 https://github.com/Kernel-SU/AnyKernel3 ak3
          cp ci/anykernel3/anykernel.sh ak3/anykernel.sh
          cp "$IMG" ak3/Image

          rel="$(cat "$GITHUB_WORKSPACE/out/include/config/kernel.release" 2>/dev/null || echo unknown-5.15.167)"
          label="$(printf '%s' '${{ github.event.inputs.label }}' | tr -cd 'A-Za-z0-9._-')"
          [ -n "$label" ] && label="-$label"
          name="AK3-KernelSU-clean-${rel}${label}-$(date +%y%m%d)"
          ( cd ak3 && zip -r9 "$GITHUB_WORKSPACE/$name.zip" . -x '.git/*' > /dev/null )

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "built AK3: $name.zip"
          unzip -l "$GITHUB_WORKSPACE/$name.zip" | tail -n 12

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload raw Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ steps.pkg.outputs.release }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
