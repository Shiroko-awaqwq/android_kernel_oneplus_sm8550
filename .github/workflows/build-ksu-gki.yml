name: Build SukiSU+SUSFS kernel (OnePlus Ace 3 / sm8550)

# Target device : OnePlus Ace 3 (PJE110), OnePlusOS/ColorOS 16.0.1.300 (CN01)
# Kernel base   : OnePlusOSS "oneplus/sm8550_v_15.0.0_ace_3" = Linux 5.15.167 (matches the device;
#                 the "b_16.0.0" line is 5.15.180 and is NOT this firmware).
#
# Source policy : pristine OnePlusOSS trees + exactly three additions:
#                 1. SukiSU-Ultra (builtin branch) in drivers/kernelsu  -> code only
#                 2. SUSFS kernel patches (susfs4ksu, gki-android13-5.15) -> fs/ + include/linux
#                 3. CONFIG_KSU / CONFIG_KSU_SUSFS in the vendor fragment
#                 Everything else from PoXiao777's tree is dropped on purpose: his branch also
#                 carries BBRv3 / zram / KPM / HMBIRD / sched tweaks across arch, block, mm, net,
#                 security - those are what break the stock vendor_dlkm module ABI (boot -> 900e).
#
# Layout (this branch sources ../vendor/oplus/... through symlinks):
#   ws/                        <- OPLUS modules & devicetree repo
#   ws/kernel_platform/common/ <- pristine kernel source
#   ci/                        <- this repo (anykernel3/anykernel.sh)
#   out/                       <- build output

on:
  workflow_dispatch:
    inputs:
      susisu_ref:
        description: 'SukiSU-Ultra kernel branch (builtin / builtin-new / dev)'
        required: false
        default: 'builtin'
      with_susfs:
        description: 'Apply SUSFS kernel patches'
        required: false
        default: 'true'
      kernel_repo:
        description: 'Kernel repo'
        required: false
        default: 'OnePlusOSS/android_kernel_oneplus_sm8550'
      kernel_ref:
        description: 'Kernel branch'
        required: false
        default: 'oneplus/sm8550_v_15.0.0_ace_3'
      label:
        description: 'Extra label for the artifact name'
        required: false
        default: ''
  push:
    branches:
      - 'ksu-gki/ace3-15.0.0'
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAKE_ARGS: >-
        ARCH=arm64 SUBARCH=arm64 HEADER_ARCH=arm64
        CC=clang CXX=clang++
        LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy
        OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip
        LLVM=1 LLVM_IAS=1
      KERNEL_LD: 'ld.lld --threads=2'

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/lib/jvm /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl dwarves flex git kmod \
            libelf-dev libssl-dev lz4 lzop python3 rsync unzip wget xz-utils \
            zip zstd device-tree-compiler patch
          pahole --version

      - name: Checkout this repo (AnyKernel3 script)
        uses: actions/checkout@v4
        with:
          path: ci
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout OPLUS modules & devicetree (pristine)
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8550
          ref: oneplus/sm8550_v_15.0.0_ace_3
          path: ws
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout kernel source (pristine OnePlusOSS)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.kernel_repo || 'OnePlusOSS/android_kernel_oneplus_sm8550' }}
          ref: ${{ github.event.inputs.kernel_ref || 'oneplus/sm8550_v_15.0.0_ace_3' }}
          path: ws/kernel_platform/common
          fetch-depth: 1
          persist-credentials: false

      - name: Download AOSP clang (r450784e)
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz" \
            -O clang.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/clang"
          tar -xzf clang.tar.gz -C "$GITHUB_WORKSPACE/clang"
          rm -f clang.tar.gz
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE"/clang/bin/clang --version | head -n 2

      - name: Verify pristine source
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile | tr '\n' ' '; echo
          echo "kernel tree commit : $(git rev-parse HEAD)"
          echo "susfs references before patching: $(grep -rl 'susfs' --include='*.c' --include='*.h' fs kernel security include 2>/dev/null | wc -l)"

      - name: Integrate SukiSU-Ultra (${{ github.event.inputs.susisu_ref || 'builtin' }})
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.susisu_ref }}"
          git clone --depth=1 --branch "$ref" https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU
          echo "SukiSU commit: $(git -C KernelSU rev-parse HEAD)"
          ls KernelSU/kernel | head -n 8

          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i 's|^endmenu$|source "drivers/kernelsu/Kconfig"\nendmenu|' drivers/Kconfig
          grep -q 'kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          # selinux internal + generated headers (objsec.h -> avc.h -> av_permissions.h)
          if [ -f KernelSU/kernel/Kbuild ]; then kfile=KernelSU/kernel/Kbuild; else kfile=KernelSU/kernel/Makefile; fi
          cat >> "$kfile" <<'KSUEOF'

          # --- OnePlus sm8550 / 5.15.167: selinux internal + generated headers ---
          ccflags-y += -I$(srctree)/security/selinux/include -I$(objtree)/security/selinux
          KSUEOF
          tail -n 4 "$kfile"

      - name: Apply SUSFS patches
        if: ${{ github.event.inputs.with_susfs != 'false' }}
        working-directory: ws
        run: |
          set -euo pipefail
          # susfs4ksu branch naming: gki-<android>-<kernel>
          git clone --depth=1 --branch gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          K=kernel_platform/common
          ls susfs4ksu/kernel_patches/ | head -n 20

          cp -v susfs4ksu/kernel_patches/fs/* "$K/fs/"
          cp -v susfs4ksu/kernel_patches/include/linux/* "$K/include/linux/"

          cd "$K"
          echo "=== applying 50_add_susfs_in_gki-android13-5.15.patch ==="
          patch --forward --no-backup-if-mismatch -p1 < ../../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || {
            echo "=== patch failed, list rejects ==="
            find . -name '*.rej' -print -exec tail -n 30 {} \;
            exit 1
          }
          echo "=== susfs applied, references now: $(grep -rl 'susfs' --include='*.c' --include='*.h' fs include/linux kernel 2>/dev/null | wc -l) ==="

      - name: Enable KernelSU / SUSFS config
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          frag=arch/arm64/configs/vendor/kalama_GKI.config
          cfgs="CONFIG_KSU=y CONFIG_KALLSYMS_ALL=y CONFIG_KPROBES=y CONFIG_EXT4_FS=y"
          if [ "${{ github.event.inputs.with_susfs }}" != "false" ]; then
            cfgs="$cfgs CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_MOUNT=y CONFIG_KSU_SUSFS_SUS_KSTAT=y CONFIG_KSU_SUSFS_SPOOF_UNAME=y CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y CONFIG_KSU_SUSFS_OPEN_REDIRECT=y CONFIG_KSU_SUSFS_ENABLE_LOG=y CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y"
          fi
          for cfg in $cfgs; do
            key=${cfg%%=*}
            if ! grep -qE "^(# )?${key}(=| is not set)" "$frag"; then
              printf '%s\n' "$cfg" >> "$frag"
            fi
          done
          tail -n 14 "$frag"

      - name: Configure kernel
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          make $MAKE_ARGS O="$GITHUB_WORKSPACE/out" gki_defconfig vendor/kalama_GKI.config
          echo "=== config sanity ==="
          grep -E '^(CONFIG_(KSU|KSU_SUSFS|KSU_SUSFS_SUS_PATH|KALLSYMS_ALL|KPROBES|EXT4_FS|MODULES|MODVERSIONS|CFI_CLANG))=' \
            "$GITHUB_WORKSPACE/out/.config" || true

      - name: Build kernel
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          free -g; df -h "$GITHUB_WORKSPACE"
          make $MAKE_ARGS LD="$KERNEL_LD" O="$GITHUB_WORKSPACE/out" -j4 Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "=== images ==="
          ls -l "$GITHUB_WORKSPACE/out/arch/arm64/boot/"

      - name: Package AnyKernel3
        id: pkg
        run: |
          set -euo pipefail
          IMG="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"
          ls -l "$IMG"
          git clone --depth=1 https://github.com/Kernel-SU/AnyKernel3 ak3
          cp ci/anykernel3/anykernel.sh ak3/anykernel.sh
          cp "$IMG" ak3/Image

          rel="$(cat "$GITHUB_WORKSPACE/out/include/config/kernel.release" 2>/dev/null || echo unknown-5.15.167)"
          tag="SukiSU"
          [ "${{ github.event.inputs.with_susfs }}" != "false" ] && tag="SukiSU-SUSFS"
          label="$(printf '%s' '${{ github.event.inputs.label }}' | tr -cd 'A-Za-z0-9._-')"
          [ -n "$label" ] && label="-$label"
          name="AK3-${tag}-clean-${rel}${label}-$(date +%y%m%d)"
          ( cd ak3 && zip -r9 "$GITHUB_WORKSPACE/$name.zip" . -x '.git/*' > /dev/null )

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "built AK3: $name.zip"
          unzip -l "$GITHUB_WORKSPACE/$name.zip" | tail -n 12

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload raw Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ steps.pkg.outputs.release }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
