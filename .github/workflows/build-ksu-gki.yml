name: Build KernelSU GKI kernel (OnePlus Ace 3 / sm8550)

# Target device : OnePlus Ace 3 (PJE110), OnePlusOS/ColorOS 16.0.1.300 (CN01)
# Kernel base   : 5.15.167 (branch oneplus/sm8550_v_15.0.0_ace_3)
# Root solution : KernelSU (tiann/KernelSU) integrated in-kernel (CONFIG_KSU=y)
#
# This kernel branch sources files from ../vendor/oplus/... through symlinks,
# so the OPLUS "modules & devicetree" repo has to sit above the kernel tree:
#
#   ws/                        <- OPLUS modules & devicetree repo
#   ws/kernel_platform/common/ <- this kernel repo
#   out/                       <- build output

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: 'KernelSU tag / branch / commit (empty or "latest" = newest release)'
        required: false
        default: 'latest'
      label:
        description: 'Extra label appended to the artifact name'
        required: false
        default: ''
  push:
    branches:
      - 'ksu-gki/ace3-15.0.0'
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAKE_ARGS: >-
        ARCH=arm64 SUBARCH=arm64 HEADER_ARCH=arm64
        CC=clang CXX=clang++
        LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy
        OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip
        LLVM=1 LLVM_IAS=1

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/lib/jvm /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl dwarves flex git kmod \
            libelf-dev libssl-dev lz4 lzop python3 rsync unzip wget xz-utils \
            zip zstd device-tree-compiler
          pahole --version

      - name: Resolve KernelSU ref
        id: ksu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.ksu_ref }}"
          if [ -z "$ref" ] || [ "$ref" = "latest" ]; then
            ref="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   https://api.github.com/repos/tiann/KernelSU/releases/latest \
                   | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1 || true)"
          fi
          [ -n "$ref" ] || ref="v3.3.1"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "KernelSU ref: $ref"

      - name: Checkout OPLUS modules & devicetree
        uses: actions/checkout@v4
        with:
          repository: PoXiao777/android_kernel_modules_and_devicetree_oneplus_sm8550
          ref: oneplus/sm8550_v_15.0.0_ace_3
          path: ws
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout kernel source (this branch)
        uses: actions/checkout@v4
        with:
          path: ws/kernel_platform/common
          fetch-depth: 1
          persist-credentials: false

      - name: Download AOSP clang (r450784e)
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz" \
            -O clang.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/clang"
          tar -xzf clang.tar.gz -C "$GITHUB_WORKSPACE/clang"
          rm -f clang.tar.gz
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE"/clang/bin/clang --version | head -n 2

      - name: Integrate KernelSU (${{ steps.ksu.outputs.ref }})
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          ref="${{ steps.ksu.outputs.ref }}"
          if ! git clone --depth=1 --branch "$ref" https://github.com/tiann/KernelSU KernelSU; then
            git clone https://github.com/tiann/KernelSU KernelSU
            git -C KernelSU checkout "$ref"
          fi
          echo "integrated KernelSU commit: $(git -C KernelSU rev-parse HEAD)"

          # wire the in-kernel KSU module into drivers/
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i 's|^endmenu$|source "drivers/kernelsu/Kconfig"\nendmenu|' drivers/Kconfig
          grep -q 'kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          # KSU pulls security/selinux internal headers (objsec.h -> avc.h);
          # give the KSU objects the source + generated include paths.
          cat >> KernelSU/kernel/Kbuild <<'KSUEOF'

          # --- OnePlus sm8550 / 5.15.167: selinux internal + generated headers ---
          ccflags-y += -I$(srctree)/security/selinux/include -I$(objtree)/security/selinux
          KSUEOF

          # CONFIG_KPROBES / KALLSYMS_ALL / EXT4_FS already come from gki_defconfig
          grep -q '^CONFIG_KSU=y' arch/arm64/configs/vendor/kalama_GKI.config || \
            printf '\n# KernelSU\nCONFIG_KSU=y\n' >> arch/arm64/configs/vendor/kalama_GKI.config

          tail -n 4 arch/arm64/configs/vendor/kalama_GKI.config

      - name: Configure kernel
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          make $MAKE_ARGS O="$GITHUB_WORKSPACE/out" gki_defconfig vendor/kalama_GKI.config
          echo "=== config sanity ==="
          grep -E '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KALLSYMS_ALL|CONFIG_EXT4_FS|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_LTO_CLANG_THIN|CONFIG_CFI_CLANG)=' \
            "$GITHUB_WORKSPACE/out/.config"

      - name: Build kernel
        working-directory: ws/kernel_platform/common
        run: |
          set -euo pipefail
          # only the kernel image is flashed (stock vendor_dlkm modules stay),
          # so skip the ~3k vendor modules to keep the build short and slim
          make $MAKE_ARGS O="$GITHUB_WORKSPACE/out" -j"$(nproc)" Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "=== images ==="
          ls -l "$GITHUB_WORKSPACE/out/arch/arm64/boot/"

      - name: Package AnyKernel3
        id: pkg
        run: |
          set -euo pipefail
          IMG="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"
          ls -l "$IMG"
          git clone --depth=1 https://github.com/Kernel-SU/AnyKernel3 ak3
          cp ws/kernel_platform/common/anykernel3/anykernel.sh ak3/anykernel.sh
          cp "$IMG" ak3/Image

          rel="$(cat "$GITHUB_WORKSPACE/out/include/config/kernel.release" 2>/dev/null || echo unknown-5.15.167)"
          label="$(printf '%s' '${{ github.event.inputs.label }}' | tr -cd 'A-Za-z0-9._-')"
          [ -n "$label" ] && label="-$label"
          name="AK3-KernelSU-${rel}${label}-$(date +%y%m%d)"
          ( cd ak3 && zip -r9 "$GITHUB_WORKSPACE/$name.zip" . -x '.git/*' > /dev/null )

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "built AK3: $name.zip"
          unzip -l "$GITHUB_WORKSPACE/$name.zip" | tail -n 12

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload raw Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ steps.pkg.outputs.release }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
